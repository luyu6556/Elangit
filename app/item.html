<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elangit · 素材详情</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 详情页专属样式；共用部分在 style.css */
  main.detail{max-width:1240px;margin:0 auto;padding:22px 20px 100px}

  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .back{flex:none}
  .dhead .sp{flex:1}

  /* 顶栏在窄屏放不下这么多东西，先把「素材 #N」这类辅助文字让掉 */
  @media (max-width:760px){
    header #hdrNote{display:none}
    header .btn.back{padding:0 9px}
  }
  @media (max-width:440px){
    header .logo{font-size:0;gap:0}
    header .btn.back{width:48px;padding:0;justify-content:center;gap:0}
    header .btn.back .back-text{display:none}
  }



  .fields .fl:first-of-type{margin-top:6px}
  .ro.small{font-size:12.5px;color:var(--ink-2)}

  /* 三段总结（理念 / 做法 / 效果）——访客看到的是排版好的三行，不是只读文本框。
     这条内容存在的意义就是被读（凭它决定要不要点进原文），挤成一坨就白费了。
     标签固定两字宽（2 字 × 13.5px ≈ 27px，给到 34px 留出间隙），三行左边缘对齐。 */
  .dgrow{display:flex;gap:8px;font-size:13.5px;line-height:1.62;color:var(--ink);margin-bottom:6px}
  .dgrow b{flex:none;width:34px;font-weight:500;color:var(--ink-2)}
  .dgrow span{min-width:0;word-break:break-word}
  .dgrow:last-child{margin-bottom:0}

  /* F5-6：AI 原先的猜测留在选项上，用黄色虚线框标出来供对照 */
  .chip.pickable{cursor:pointer}
  .chip.pickable:hover{opacity:.8}
  .chip.aiguess{border:1.5px dashed #BA7517}
  .chip.cur{outline:1.5px solid currentColor;outline-offset:-1px}
  .aiguessline{font-size:11.5px;color:var(--warn);background:var(--warnb);border-radius:6px;padding:5px 9px;margin-top:8px;display:inline-block}

  /* 访客态：chip 点不动，就别给它能点的样子（2026-09-22）。
     上一版只有 cursor 的差别，而 cursor 只有悬停时才看得见 —— 等于没提示，
     用户照样去点（真实反馈）。现在四处一起收：
       ① 一句「只读」说明（.roline，文案在 renderFields 里）；
       ② 光标收回默认；③ 悬停不再变淡（变淡本身就是「可点」的暗号）；
       ④ AI 的黄框在访客那儿换成灰字（见 aiNote()）—— 黄色是在喊「来处理我」。 */
  .roline{
    font-size:12px;color:var(--ink-3);background:#F7F5F1;
    border:1px dashed var(--line-2);border-radius:7px;padding:7px 10px;margin-bottom:12px;
  }
  body:not(.is-owner) .chip{cursor:default}
  body:not(.is-owner) .chip:hover{opacity:1}

  .tagadd{width:104px;border:1px dashed var(--line-2);border-radius:20px;padding:5px 9px;font-size:12px;outline:none}

  .kv{display:flex;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
  .kv b{font-weight:400;color:var(--ink-2);min-width:64px;flex:none}

  .danger{margin-top:6px}
  .danger .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn.del{background:#B3261E}
  .btn.del:hover{opacity:.9}

  /* 封面来历那一行（「从截图裁出主体」「取自原文网页」）。2026-09-22 从 h2 旁边
     挪到图下面——卡片标题不再只讲封面。空的时候整块不占位。 */
  .covnote{font-size:11.5px;color:var(--ink-3);margin-top:8px}
  .covnote:empty{display:none}
  /* 项目名称 + 摘要搬进封面卡片后装在这里（2026-09-22） */
  #coverFields{margin-top:2px}
  /* 左栏现在只有一张卡片、还装了名称与摘要，把封面图的高度上限收一点，
     否则 900px 高的窗口下整栏会顶到 .col-media 的 max-height（100vh-92px）
     而在栏内出现滚动条——多图素材实测溢出 22px。30vh 留出约 14px 余量。 */
  .coverbox img{max-height:30vh}

  /* 右栏底部那条常驻保存（2026-09-22）。sticky bottom：这一栏比视口高，
     所以滚到哪儿它都在，滚到最底才归位到内容末尾。 */
  .savebar{
    position:sticky;bottom:0;z-index:5;
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:10px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
    border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.06);
  }
  .savebar .hint{font-size:12px;color:var(--ink-3);flex:1}
  /* 手机端这一条只给一句，否则提示自己就占两行，把保存条撑成一块 */
  .savebar .hint-short{display:none}
  @media (max-width:800px){
    .savebar .hint-long{display:none}
    .savebar .hint-short{display:inline}
  }
  /* 「有没保存的东西」要看得见：这些字段不是即改即存，改完不点就白改 */
  .savebar.dirty{border-color:#BA7517;background:var(--warnb)}
  .savebar.dirty .hint{color:var(--warn)}

  /* 窄屏（≤980px，.dcols 已竖排成单列）：sticky 钉不住。
     sticky 的活动范围被**包含块**框住，而它的包含块就是 .col-fields 自己。
     单列时 .col-fields 被更高的左栏（封面 + 名称 + 摘要 + 缩略图）顶到首屏
     之外，于是 bottom:0 只能把它压在这一栏顶端 —— 视口里根本看不见。
     实测 390×844：滚动 0 时 barTop=944，而视口只有 844px。
     所以窄屏换成 fixed：脱离文档流钉在窗口底部，与这一栏多高、在哪儿无关。
     （祖先里没有 transform/filter/will-change，fixed 不会被降级成 absolute。） */
  @media (max-width:980px){
    .savebar{
      position:fixed;left:0;right:0;bottom:0;z-index:60;
      border-radius:0;border-left:0;border-right:0;border-bottom:0;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -6px 18px rgba(0,0,0,.08);
    }
    /* 这一条是浮在内容上的，给正文留出等高的底边距，别盖住最后一张卡片 */
    main.detail{padding-bottom:112px}
  }

  /* 折叠卡片：记录 / 管理。用原生 details，不写 JS 开关。 */
  .panel.fold{padding:0}
  .panel.fold > summary{
    list-style:none;cursor:pointer;padding:15px 18px;
    display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:500;
  }
  .panel.fold > summary::-webkit-details-marker{display:none}
  .panel.fold > summary::after{content:'▾';margin-left:auto;font-size:11px;color:var(--ink-3);transition:transform .18s}
  .panel.fold[open] > summary::after{transform:rotate(180deg)}
  .panel.fold > summary .muted{font-weight:400;font-size:12px}
  .foldbody{padding:0 18px 18px}
  .subttl{font-size:12.5px;font-weight:500;color:var(--ink-2);margin:16px 0 8px}
  .subttl:first-child{margin-top:0}

</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Elangit</a>
  <!-- 返回按钮放在顶栏而不是正文顶部：顶栏是 sticky 的，滚到哪儿都在。
       原先只有正文顶部一行灰色小字「← 返回灵感库」，一滚动就出屏幕，
       用户找不着——这是真实反馈，不是设想。 -->
  <a class="btn ghost sm back" href="library.html" aria-label="回到素材库">
    <svg class="back-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="back-text">回到素材库</span>
  </a>
  <nav class="hnav">
    <a href="add.html" class="owner-only">收进灵感</a>
  </nav>
  <div class="spacer"></div>
  <span class="muted" id="hdrNote"></span>
  <span id="ownerBar"></span>
</header>

<main class="detail">
  <div class="errcard" id="err" style="display:none"></div>

  <div id="wrap" style="display:none">
    <div class="dhead">
      <span class="muted" id="dCrumb">素材</span>
      <div class="sp"></div>
      <span class="st" id="dStatus"></span>
    </div>

    <div class="dcols">
      <section class="col-media">
        <!-- 这张卡片 2026-09-22 收了两轮改动：
             ① 「全部原图」那张独立卡片取消（单图时它就是一句「库里没有原图」的空转；
                多图时真正要的东西只有「换封面」，而那是封面自己的事）。
             ② 「项目名称 + 摘要」从右栏并进来（用户拍板：封面图和这两样合起来才是
                「这条素材是什么」，分成两张卡片摆一左一右是割裂的）。
             所以现在左栏只有一张卡片，标题也从「封面」改成了「基本信息」。 -->
        <div class="panel">
          <h2>基本信息</h2>
          <div class="coverbox" id="coverBox"></div>
          <!-- 封面的来历（「从截图裁出主体」「取自原文网页」）。从 h2 旁边挪到图下面：
               卡片标题不再只讲封面，这句挂在图下面才是它该在的位置。 -->
          <div class="covnote" id="coverNote"></div>
          <!-- 「去哪儿看原件」的唯一入口：网址素材 → 跳原文网址；图片素材 → 看原图。
               原先这个链接在右栏「来源」卡片里，离封面一整屏，用户找不到。 -->
          <div class="covgo" id="coverGo"></div>
          <div id="coverFields"></div>
          <div class="covacts owner-only" id="coverActs"></div>
          <div class="shots" id="shots"></div>
          <div class="covrow" id="coverRow"></div>
        </div>
      </section>

      <div class="col-fields">
        <section class="fields" id="fields"></section>
        <!-- 保存条常驻右栏底部（2026-09-22）。原先那颗「保存以上字段」只画在
             「AI 读出来的」panel 里，可它一次存 7 个字段——包括最上面「基本信息」的
             项目名称与摘要。改了顶上的字要滚过 5 张卡片才找得到保存键，很容易白改。 -->
        <div class="savebar owner-only" id="saveBar">
          <span class="hint"><span class="hint-long">改了卡片里的字点右边保存；抽屉、标签、来源点了就存</span><span class="hint-short">改完点右边保存</span></span>
          <button class="btn sm" data-act="save-fields">保存修改</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="mask" id="zoom">
  <div class="shot">
    <div class="bar">
      <h3 id="zoomTitle">原图</h3>
      <button class="btn ghost sm" data-close>关闭</button>
    </div>
    <div class="box zoom-box">
      <button class="zoom-nav zoom-prev" id="zoomPrev" type="button" aria-label="查看上一张" data-zoom-step="-1">‹</button>
      <div id="zoomBox"></div>
      <button class="zoom-nav zoom-next" id="zoomNext" type="button" aria-label="查看下一张" data-zoom-step="1">›</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="pipeline.js"></script>
<script src="store.js"></script>
<!-- ai.js 是 2026-09-20 才加进来的：封面重裁要能对「换了之后的封面图」现场
     判一次矩形（F5-8 第三条兜底），所以详情页也需要 AI 层。
     它依赖 store（模块顶层就取 store.cloud），必须排在 store.js 之后。 -->
<script src="ai.js"></script>
<script src="diff.js"></script>
<script src="aiqueue.js"></script>
<script src="track.js"></script>
<script src="ownerbar.js"></script>
<script>
  // B-001：详情页也要能接着跑没跑完的 AI。典型情形是——录入完就关了页面，
  // 回头从列表点进这一条看详情，这时候本页比谁都更清楚「用户正等着结果」。
  window.Elangit.aiQueue.autoSweep({ delay: 1500 });
</script>
<script>
(function () {
  'use strict';
  var S = window.Elangit.store, cfg = window.Elangit.config, A = window.Elangit.auth,
      IMG = window.Elangit.imaging, OB = window.Elangit.ownerBar,
      AI = window.Elangit.ai, T = window.Elangit.track, D = window.Elangit.diff;
  var $ = function (id) { return document.getElementById(id); };

  var id = Number((/[?&]id=(\d+)/.exec(location.search) || [])[1] || 0);

  /* ---------- 来自翻阅页的返回上下文（项目灵感筛选一期，P2-6） ----------
     只做一件事：把顶栏那颗返回按钮指向「回到翻阅」，并把卡位号带回去，
     让用户从详情回到同一张牌。**不改详情本身的任何渲染**，也不动原有返回路径
     （不复制第二份详情页）。
     两个来源（2026-09-23 加首页）：
       · from=deck&pid=N&i=K —— 项目翻阅页，回到那个项目的第 K 张；
       · from=home&i=K       —— 首页全库翻阅，回到首页牌堆的第 K 张。
         首页没有项目上下文（翻的是全库），所以这一支不带也不读 pid。
     这些参数只在从牌堆点进来时才存在；直接开 item.html?id=N 时一切照旧。 */
  var fromDeck = /[?&]from=deck/.test(location.search);
  var fromHome = /[?&]from=home/.test(location.search);
  var deckPid = Number((/[?&]pid=(\d+)/.exec(location.search) || [])[1] || 0);
  var deckIdx = Number((/[?&]i=(\d+)/.exec(location.search) || [])[1] || 0);
  var deckName = '';

  function applyDeckBack() {
    var a = document.querySelector('header a.back');
    // 首页这一支一次写完：它没有项目名要等（见下面启动处那条 fetchProject）。
    // 面包屑刻意不在这里抢写 —— render() 稍后会用「素材 #id · 标题」覆盖
    // dCrumb，抢写的唯一结果是闪一下（那是既有实现的次序，不在本轮改动范围）。
    if (fromHome) {
      if (a) {
        a.setAttribute('href', 'index.html?i=' + deckIdx);
        a.setAttribute('aria-label', '回到首页翻阅');
        var th = a.querySelector('.back-text');
        if (th) th.textContent = '回到翻阅';
      }
      return;
    }
    if (!fromDeck || !deckPid) return;
    if (a) {
      a.setAttribute('href', 'projects/deck.html?project=' + deckPid + '&i=' + deckIdx);
      a.setAttribute('aria-label', '回到项目翻阅');
      var t = a.querySelector('.back-text');
      if (t) t.textContent = '回到翻阅';
    }
    var crumb = $('dCrumb');
    if (crumb && deckName) crumb.textContent = '素材 · 来自项目「' + deckName + '」';
  }
  // 先把返回按钮改掉：它不依赖任何数据加载，早就该是对的。
  // 面包屑要等项目名读回来（见下面启动处的 fetchProject），所以那一半
  // 由 applyDeckBack 在有名字之后再补一次。
  applyDeckBack();

  var state = {
    item: null,
    imgs: [],        // item_images，按 seq 升序
    taxonomy: null,
    saving: false,
    zoomIndex: 0
  };

  /* ---------- 小工具 ---------- */

  function esc(s) { return OB.esc(s); }
  function fmtErr(e) { return S.describe(e); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function fmtTime(iso, withTime) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return ('0' + n).slice(-2); };
    var s = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    if (withTime) s += ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    return s;
  }

  function showErr(msg) {
    var el = $('err');
    if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
    el.style.display = 'block';
    el.textContent = msg;
  }

  function tagChip(name, on, opts) {
    var o = opts || {};
    var c = (state.taxonomy && state.taxonomy.tagColor[name]) || null;
    var style = c ? 'color:' + c.c + ';background:' + c.bg : 'color:var(--ink-2);background:#F1EFEB';
    var cls = 'chip' + (o.clickable ? ' pickable' : '') + (on ? ' cur' : '') + (o.aiguess ? ' aiguess' : '');
    var attrs = o.attrs || '';
    return '<span class="' + cls + '" ' + attrs + ' style="' + style + '">' + esc(name)
      + (o.rm ? '<x data-act="rmtag" data-tag="' + esc(name) + '" data-from="' + o.rm + '">×</x>' : '')
      + '</span>';
  }

  /* ---------- 保存 ---------- */

  // 每个写路径都从这儿走：串行化 + 失败要说清。
  // 抽屉、标签、来源是三处「点了就存」的地方（F5-2），
  // 它们各自发一次请求会在快速连点时乱序落库，所以在这里排队。
  var chain = Promise.resolve();
  function save(patch, okMsg) {
    chain = chain.then(function () {
      return S.updateItem(id, patch).then(function (saved) {
        // 用服务端回来的行刷新本地模型，保证界面与库一致
        if (saved) state.item = saved;
        render();
        // 存成功了就把保存条上的「有未保存改动」标记撤掉（它在 #fields 之外，
        // render() 换掉 innerHTML 不会碰到它）
        var bar = $('saveBar');
        if (bar) bar.classList.remove('dirty');
        toast(okMsg || '已保存');
      }).catch(function (e) {
        toast('保存失败：' + fmtErr(e));
        throw e;
      });
    }).catch(function () { /* 已提示，链继续 */ });
    return chain;
  }

  /* ---------- 渲染：封面与图片 ---------- */

  function coverNoteText() {
    var it = state.item;
    if (!it.cover_thumb) return '';   // 没有封面时不说这句：图区自己会说明原因，别讲两遍
    if (it.cover_source === 'crop') return '从截图裁出主体';
    if (it.cover_source === 'raw') return '整图（未裁）';
    // 2026-09-21 新增：只填网址时封面是从原文网页抓来的，库里没有原件
    if (it.cover_source === 'link') return '取自原文网页（库里没有原件）';
    return it.cover_source || '';
  }

  // 裁切矩形按**图**取，不按素材取（2026-09-20 改）。
  //
  // 原先这里读的是 `items.ai_raw.rect`，那是「送进模型那张图」的矩形，配上
  // `cover_index === 0` 的硬条件。结果：用户在详情页把封面换成第 2 张图之后，
  // 第 2 张图永远没有矩形可用，而按钮又只在第 1 张时才出现 —— 「换封面」和
  // 「重裁」两条兜底互相堵死，换了图的封面再也裁不了（A14 实测踩到：
  // 纽约高线公园那条的封面留着右侧一整条文字面板）。
  // 现在录入时把矩形按 seq 写进 item_images.ai_rect，这里按当前封面图的
  // seq 取，与 cover_index 是不是 0 无关。
  function rectFor(ci) {
    var img = state.imgs[ci];
    var r = img && img.ai_rect;
    if (!r) return null;
    var l = Number(r.left), t = Number(r.top), rr = Number(r.right), b = Number(r.bottom);
    if (!isFinite(l) || !isFinite(t) || !isFinite(rr) || !isFinite(b)) return null;
    if (rr <= l || b <= t) return null;
    if (l === 0 && t === 0 && rr === 100 && b === 100) return null;   // 等于整图 = 不用裁
    return { left: l, top: t, right: rr, bottom: b };
  }

  function renderCover() {
    var it = state.item;
    var box = $('coverBox');
    var ci = it.cover_index || 0;
    // cover_source === 'link'：封面来自原文网页的抓取，item_images 里**没有**原件。
    var linkCover = it.cover_source === 'link';
    var hasImgs = state.imgs.length > 0;

    // 大图区。**点它去哪儿由素材类型决定**（2026-09-22 用户拍板）：
    //   有本地原件 → 放大看原图（一直如此）
    //   只抓了网页 → 新标签打开原文网址
    // 后者原先点了**没有任何反应**：data-act 写死 zoom，而 zoom() 读 state.imgs[ci]，
    // link 素材的 imgs 是空的，函数第一行就 return 了。
    if (it.cover_thumb) {
      box.className = 'coverbox' + (linkCover ? ' c-link' : '');
      box.innerHTML = '<img src="' + S.toDataUrl('image/jpeg', it.cover_thumb) + '" '
        + 'data-act="' + (linkCover ? 'open-src' : 'zoom') + '" data-i="' + ci + '" alt="封面">';
    } else {
      box.className = 'coverbox';
      box.innerHTML = it.source_url
        ? '<div class="none">这条是网址素材，没抓到封面图</div>'
        : '<div class="none">这条素材没有配图<br>纯文本的灵感照样进库</div>';
    }
    $('coverNote').textContent = coverNoteText();

    // 「去哪儿看原件」的唯一入口。有原图给「查看原图」，有链接给「跳转原文网址」——
    // 两个都是链接，所以任何一条素材都至少有一个出口，不会再出现「点了没反应」。
    // 原先这个链接在右栏「来源」卡片里，离封面一整屏，用户找不到（2026-09-22）。
    var go = [];
    if (hasImgs) {
      go.push('<button class="linkbtn" data-act="zoom" data-i="' + ci + '">查看原图</button>');
    }
    if (it.source_url) {
      go.push('<a class="linkbtn" href="' + esc(it.source_url) + '" target="_blank" rel="noopener">跳转原文网址 ↗</a>');
    }
    $('coverGo').innerHTML = go.join(' ');

    // F5-8：换封面 / 重裁的入口。只有「有本地原件」时才存在——
    // 抓来的网页封面没有原件，没有可裁的东西，按钮就不该出现。
    var rect = rectFor(ci);
    var acts = [];
    if (hasImgs) {
      if (it.cover_source !== 'raw') {
        acts.push('<button class="btn ghost sm" data-act="cover-raw">用整图（不裁）</button>');
      }
      if (rect) {
        acts.push('<button class="btn ghost sm" data-act="cover-crop">按 AI 矩形重裁</button>');
      } else {
        // 没矩形不等于不能裁，只是要多跑一次 AI 去判这张图。
        // 按钮文案把代价说出来，别让用户以为点一下就完事。
        acts.push('<button class="btn ghost sm" data-act="cover-crop">让 AI 判这张图的画面区（要等一会儿）</button>');
      }
    }
    $('coverActs').innerHTML = acts.join('');

    // 信息行只在有本地原件时给。link 素材原先在这张卡片里把「库里没有原件」说了三遍
    // （标题旁、按钮行、这一行），那是用户 2026-09-22 点名的冗余。
    var rows = [];
    if (hasImgs) {
      rows.push('封面取第 ' + (ci + 1) + ' 张');
      rows.push('封面来源 ' + (it.cover_source || '—'));
      if (rect) {
        rows.push('这张图的 AI 矩形 ' + rect.left + '/' + rect.top + '/' + rect.right + '/' + rect.bottom + '%');
      } else if (it.ai_raw && it.ai_raw.rect) {
        // 有矩形但不在当前这张图上：如实说明它属于哪张，不要拿它冒充当前图的
        rows.push('AI 矩形是录入时那张图的，换封面后对这张不适用');
      } else if (it.ai_raw) {
        rows.push('AI 没给可用矩形');
      } else {
        // 旧素材：ai_raw 这一列是后加的，那时候 AI 到底给没给矩形已经查不到了。
        // 这里不能顺口说「AI 没给」——那是在断言一个我不知道的事实。
        rows.push('这条早于「记录 AI 原值」上线，矩形没留下来');
      }
    }
    $('coverRow').innerHTML = rows.map(function (r) { return '<span>' + esc(r) + '</span>'; }).join('<span>·</span>');

    // 项目名称与摘要（2026-09-22 从右栏并进来）。渲染放在这张卡片的函数里，
    // 因为它们和封面图属于同一个「这条素材是什么」的块。
    $('coverFields').innerHTML = coverFieldsHtml();
  }

  // 原先它是右栏第一张卡片「基本信息」。并进来的理由：封面图和名字/摘要分开摆
  // 一左一右，眼睛要在两栏之间来回跳；合起来才是这个素材的身份块。
  // 注意 id 没变（fTitle / fSummary）——保存条那边一次读 7 个字段，靠的就是它们。
  function coverFieldsHtml() {
    var it = state.item;
    var owner = A.isOwner();
    var h = [];
    h.push('<label class="fl">项目名称 <span class="muted">卡片上显示的就是这个</span></label>');
    h.push(owner
      ? '<input class="inp" id="fTitle" value="' + esc(it.ai_title || '') + '" maxlength="20" placeholder="案例或项目名，比如「纽约高线公园」">'
      : (it.ai_title ? ro(it.ai_title) : '<div class="ro empty">未命名</div>'));
    h.push('<label class="fl">摘要</label>');
    h.push(owner
      ? '<input class="inp" id="fSummary" value="' + esc(it.ai_summary || '') + '" placeholder="一句话摘要">'
      : ro(it.ai_summary));
    return h.join('');
  }

  // 多图素材的换封面条。「全部原图」那张独立卡片 2026-09-22 取消（用户拍板），
  // 职能并进封面卡片：单图/无图时整块不渲染（原来它是一张只有一句「库里没有原图」
  // 的空转卡片），多图时才出现——因为多图唯一非它不可的用途是「换封面」。
  function renderShots() {
    var it = state.item;
    var ci = it.cover_index || 0;
    var box = $('shots');
    if (state.imgs.length < 2) { box.innerHTML = ''; return; }
    var owner = A.isOwner();
    box.innerHTML = '<div class="shots-hint">共 ' + state.imgs.length + ' 张'
      + (owner ? '，点「用这张当封面」换封面' : '，点开可放大')
      + '（原件永不被裁掉）</div>'
      + state.imgs.map(function (im, i) {
        var on = i === ci;
        return '<div class="shot-t' + (on ? ' t-on' : '') + '">'
          + '<div data-act="zoom" data-i="' + i + '">'
          + (on ? '<span class="pick">封面</span>' : '')
          + '<img src="' + S.toDataUrl(im.mime, im.data_base64) + '" alt="" loading="lazy">'
          + '</div>'
          + '<div class="lb"><span>第 ' + (i + 1) + ' 张</span><span>' + im.width + '×' + im.height + '</span></div>'
          + (owner && !on
              ? '<button class="linkbtn" style="width:100%;border-radius:0;border-left:0;border-right:0;border-bottom:0;text-align:center" data-act="cover-use" data-i="' + i + '">用这张当封面</button>'
              : '')
          + '</div>';
      }).join('');
  }

  /* ---------- 渲染：字段区 ---------- */

  function ro(v, cls) {
    if (v) return '<div class="ro ' + (cls || '') + '">' + esc(v) + '</div>';
    return '<div class="ro empty ' + (cls || '') + '">（空）</div>';
  }

  // 三段总结（理念 / 做法 / 效果）。
  //
  // 两种身份两种形态，理由与其它 AI 字段一致（所有者要能改、访客只能读），
  // 但**访客那一版特意做成排版好的三行**而不是 ro()：这条内容存在的意义就是
  // 被读，段落挤成一坨会白费。标签加粗，扫一眼就知道哪句是理念哪句是效果。
  //
  // 容错：标签可能不存在（AI 只给一段，或还没跑过）。所以按行切、能认出标签就
  // 加粗，认不出就整行当普通文字——绝不替模型编一个「理念：」上去。
  var DIGEST_LINE = /^(理念|做法|效果)\s*[：:]\s*([\s\S]*)$/;
  function digestHtml(v, owner) {
    if (owner) {
      return '<textarea class="inp" id="fDigest" style="min-height:88px"'
        + ' placeholder="三行，每行依次以「理念：」「做法：」「效果：」开头，整段不超过 120 字">'
        + esc(v || '') + '</textarea>';
    }
    var rows = String(v || '').split('\n').map(function (ln) {
      ln = String(ln).trim();
      if (!ln) return '';
      var m = DIGEST_LINE.exec(ln);
      return m
        ? '<div class="dgrow"><b>' + esc(m[1]) + '</b><span>' + esc(m[2]) + '</span></div>'
        : '<div class="dgrow"><span>' + esc(ln) + '</span></div>';
    }).join('');
    return rows || '<div class="ro empty">（空）</div>';
  }

  /* ---------- 改动对照（F2-8） ---------- */

  // 比较规则不写在这里，在 diff.js —— 数据页要按同一套规则算「修改率」（A2 的判据），
  // 两处各写一份迟早会给出两个答案（详情页说改了 3 处、数据页说 2 处）。
  // 这一页只负责把结果画出来。
  //
  // 只返回**内容**，不返回 panel 外壳与 h2（2026-09-22）：它现在住进「记录」那张
  // 折叠卡片里，和外层标题重复就是又一处冗余。
  function diffHtml(it) {
    var head = '<div class="subttl">改动对照 <span class="muted">AI 原值 → 现在</span></div>';

    if (!it.ai_raw) {
      // 旧素材：ai_raw 是 v7 才加的列。这里要如实说是「没留下来」，
      // 不能写成「没改过」——那是在断言一个我不知道的事实。
      return head
        + '<div class="muted">这条早于「记录 AI 原值」上线，AI 当时给的是什么没留下来，'
        + '所以算不出差异。新收的素材都会有。</div>';
    }

    var rows = D.changed(it);
    if (!rows.length) {
      return head + '<div class="muted">和 AI 给的一模一样，一处没改。</div>';
    }

    var h = [head, '<div class="difflist">'];
    rows.forEach(function (r) {
      h.push('<div class="diffrow"><b>' + esc(r.label) + '</b>'
        + '<span class="was">' + esc(r.before || '（空）') + '</span>'
        + '<span class="arrow">→</span>'
        + '<span class="now">' + esc(r.after || '（空）') + '</span>'
        + '</div>');
    });
    h.push('</div>');
    h.push('<div class="muted" style="margin-top:10px">「原值」来自 AI 最近一次成功识别的快照，'
      + '改动永远不会覆盖它，所以这一列永远是真的。</div>');
    return h.join('');
  }

  // 右栏结构（2026-09-22 用户拍板）：
  //   基本信息**已在左栏封面卡片里**（见 coverFieldsHtml），所以右栏从这里开始：
  //   1 设计说明总结（理念/做法/效果 三段）
  //   2 归类（抽屉 + 标签）
  //   3 来源（平台 + 链接）
  //   4 我为什么存它
  //   5 文本（网页标题 + 画面描述 + 图中文字 + 自己粘的原文）
  //   6 记录（改动对照 + 时间，折叠）
  //   7 管理（分享 + 删除，折叠，仅所有者）
  // 另加一条常驻的保存条（在 #fields 之外的 #saveBar，见 HTML 注释）。
  function renderFields() {
    var it = state.item;
    var owner = A.isOwner();
    var ai = it.ai_raw || {};
    var h = [];

    /* ---- 1 设计说明总结（2026-09-22 新增） ----
       为什么单独一张卡而不是并进「基本信息」的摘要里：
       两者用途不同，长度也差一个量级。摘要（≤50 字）是给列表卡片认人用的，
       只显示两行；digest（≈120 字、三段）回答的是「这份设计说明讲了什么、
       值不值得点进原文」。硬塞成一份的话，卡片上永远只看到第一段。 */
    var dg = it.ai_digest || '';
    var pageText = it.page_text || '';
    // 模型答了、但格式不合约定，被 ai.js 的严格校验丢掉的那段原文（2026-09-22 第二轮）。
    // 它只用来**把空态的原因说准**，不展示内容——展示出来就又变成「把不合规的东西
    // 当总结给人看」了，那正是这一轮要消掉的问题。
    var dgRaw = ai.digestRaw || '';
    // 既没抓到正文、也没有总结时，访客看到的会是一张空卡 + 一句「待补」，
    // 不如不显示。所有者例外：那里面是他自己补写的入口。
    if (dg || pageText || owner) {
      h.push('<div class="panel"><h2>设计说明总结</h2>');
      if (dg) {
        h.push(digestHtml(dg, owner));
      } else {
        h.push('<div class="muted" style="margin-bottom:10px">'
          + (pageText
              // 有正文却没总结，原因有两种，必须分开说（PRD F2-12 的空态要求「如实归因」）：
              //   ① 模型答了但三项没给全 → 被严格校验丢弃（dgRaw 有值）；
              //   ② 模型压根没答 → 它判这条不是设计项目，id=8 那类榜单页的预期结果。
              // 混成一句①就是在断言一个不成立的原因。
              ? (dgRaw
                  ? 'AI 读了正文，但没按「理念 / 做法 / 效果」三项给全，那段已被丢弃——'
                    + '宁可空着，也不把不合约定的回答当成总结。'
                  : 'AI 读了正文，判这条不是设计项目（新闻 / 榜单 / 合集），没有输出三段总结。')
              : '这条没抓到可读的网页正文（小红书、公众号这类没有），总结待补。')
          + '</div>');
        if (owner) {
          h.push(digestHtml('', true));
        }
      }
      if (pageText) {
        h.push('<div class="covnote">总结依据：抓到的网页正文 ' + pageText.length + ' 字。</div>');
      }
      h.push('</div>');
    }

    /* ---- 2 归类：抽屉 + 标签（都是「点了立即保存」，所以放同一张卡片） ---- */

    // 同一句「AI 原来的判断」，两种身份要两种读法：
    //   所有者看到的是**待我处理的差异**（黄框，是提醒）；
    //   访客看到的是**背景信息**（灰字，是叙述）。
    // 用同一个函数而不是散在四处三元表达式，免得将来只改了一处。
    function aiNote(inner) {
      return owner
        ? '<div class="aiguessline">' + inner + '</div>'
        : '<div class="muted" style="margin-top:8px">' + inner + '</div>';
    }

    h.push('<div class="panel"><h2>归类</h2>');

    // 访客态降级（2026-09-22）：这些 chip 点不动，就不该长得像能点。
    // 光靠一行小灰字是拦不住的——上一版就是这样，用户照样去点（真实反馈）。
    // 所以这里三件事一起做：① 明写一句「只读」并说清为什么；② 把所有
    // 「点了会怎样」的操作指引全收掉；③ 光标与悬停反馈收回去（见样式）。
    if (!owner) {
      h.push('<div class="roline">只读视图：抽屉、标签、来源都由所有者维护，这里点了不会有反应。</div>');
    }

    h.push('<label class="fl">抽屉'
      + (owner ? ' <span class="muted">封闭集合，点了立即保存</span>' : '') + '</label>');
    h.push('<div class="chips" id="catChips">'
      + state.taxonomy.categories.map(function (c) {
          return tagChip(c.name, c.name === it.category, {
            clickable: owner,
            aiguess: owner && ai.category === c.name && ai.category !== it.category,
            attrs: 'data-cat="' + esc(c.name) + '"'
          });
        }).join('')
      + '</div>');
    if (ai.category && ai.category !== it.category) {
      h.push(aiNote('AI 原本判的是「' + esc(ai.category) + '」'
        + (ai.categoryOutOfList ? '（原话「' + esc(ai.categoryOutOfList) + '」不在清单里，已落兜底）' : '')
        + '，现在是「' + esc(it.category || '未归类') + '」。'));
    } else if (ai.category) {
      // 「没改过」是所有者视角的话（我改没改），访客版只说事实
      h.push('<div class="muted" style="margin-top:8px">沿用 AI 的判断'
        + (owner ? '，没改过。' : '。') + '</div>');
    }

    h.push('<label class="fl">标签'
      + (owner ? ' <span class="muted">AI 打的标虚线框，我加的实线，点了立即保存</span>'
               : ' <span class="muted">虚线框是 AI 打的，实线是所有者加的</span>') + '</label>');
    h.push('<div class="chips" id="tagChips">');
    var aiTags = it.ai_tags || [], myTags = it.my_tags || [];
    if (!aiTags.length && !myTags.length) {
      h.push('<span class="muted">还没有标签</span>');
    }
    aiTags.forEach(function (t) {
      h.push(tagChip(t, false, {
        aiguess: true, rm: owner ? 'ai' : ''
      }));
    });
    myTags.forEach(function (t) {
      h.push(tagChip(t, false, { rm: owner ? 'my' : '' }));
    });
    if (owner) h.push('<input class="tagadd" id="tagAdd" data-act="addtag" placeholder="+ 加标签" maxlength="12">');
    h.push('</div>');
    if (aiTags.length) {
      // 「点掉就表示我不同意它」是一句**操作指引**。访客做不到，说出来只会让人
      // 去找那颗点不动的 chip —— 这正是「看起来能点却不能点」的来源。
      h.push(aiNote('虚线框的 ' + aiTags.length + ' 个是 AI 打的'
        + (owner ? '；把 AI 的标签点掉就表示我不同意它。' : '。')));
    }
    h.push('</div>');

    /* ---- 3 来源（F5-6）。「在原帖打开」的链接搬到封面卡片了，这里只留可编辑的平台与网址 ---- */
    h.push('<div class="panel"><h2>来源'
      + (owner ? ' <span class="muted">平台不对可以直接改</span>' : '') + '</h2>');
    var cur = it.source_platform || '';
    var inList = cfg.platforms.indexOf(cur) >= 0;
    h.push('<div class="chips" id="platChips">'
      + cfg.platforms.map(function (p) {
          var on = (p === cur) || (p === '其他' && cur && !inList);
          return tagChip(p, on, {
            clickable: owner,
            aiguess: owner && ai.platform === p && ai.platform !== cur,
            attrs: 'data-plat="' + esc(p) + '"'
          });
        }).join('')
      + '</div>');
    if (owner && (((cur === '其他') || (cur && !inList)))) {
      h.push('<input class="inp" id="platFree" style="margin-top:10px" maxlength="20" '
        + 'placeholder="来源名，比如「有方」「建筑学报」" value="' + esc(inList ? '' : cur) + '">'
        + '<div class="muted" style="margin-top:6px">填了名字按回车保存。</div>');
    } else if (!owner && cur && !inList) {
      h.push('<div class="muted" style="margin-top:8px">来源名：' + esc(cur) + '</div>');
    }
    if (ai.platform && ai.platform !== cur) {
      h.push(aiNote('AI 原本猜的是「' + esc(ai.platform) + '」'
        + (owner ? '（黄色虚线框那个）' : '') + '，现在是「' + esc(cur || '未填') + '」。'));
    } else if (ai.platform) {
      h.push('<div class="muted" style="margin-top:8px">沿用 AI 的判断'
        + (owner ? '，没改过。' : '。') + '</div>');
    }

    h.push('<label class="fl">来源链接 <span class="muted">封面卡片上那颗「跳转原文网址」用的就是它</span></label>');
    if (owner) {
      h.push('<input class="inp" id="fUrl" value="' + esc(it.source_url || '') + '" placeholder="原文网址">');
    } else {
      h.push(ro(it.source_url, 'small'));
    }
    h.push('</div>');

    /* ---- 4 我的备注 ---- */
    h.push('<div class="panel"><h2>我为什么存它</h2>');
    h.push(owner
      ? '<input class="inp" id="fNote" value="' + esc(it.my_note || '') + '" placeholder="打算用在哪、想拿走什么">'
      : ro(it.my_note));
    h.push('</div>');

    /* ---- 5 文本（AI 读出来的 + 原文，2026-09-22 合并） ---- */

    // 这张卡里每一块都是「有内容才显示」。**全都空的时候整张卡不渲染**：
    // 「只填了网址、又没抓到正文」的素材（实测 id=15 / 11 / 8 就是），
    // 访客打开会看到一个只有「文本」二字的空卡。
    // 所有者例外——下面是他的补录入口，空着正是要填的时候。
    var hasLocalImgs = state.imgs.length > 0;
    var showRaw = owner || !!it.raw_text;
    if (it.page_title || hasLocalImgs || showRaw) {
      h.push('<div class="panel"><h2>文本</h2>');

      // 网页标题：录入时从原文网页抓的（2026-09-21）。它往往是「只填网址」素材里
      // 信息量最大的一行——原文标题带着 AI 收敛后丢掉的作者与地点。
      // **网页描述不再显示**（2026-09-22 用户判为无用信息）：它长、信息密度低，
      // 而且和摘要高度重叠。它**仍然会给 AI 看**（analyze 的 pageDesc 照传），
      // 只是不再铺到界面上。
      if (it.page_title) {
        h.push('<div class="kv"><b>网页标题</b><span>' + esc(it.page_title) + '</span></div>');
        h.push('<div class="hint" style="margin:8px 0 4px">这行是录入时从原文网页抓的，'
          + 'AI 判抽屉与标签时会看到它。</div>');
      }

      // 「画面描述 / 图中文字」只有 AI **读过图**才会有值。网址素材库里没有原件
      // （封面是抓来的，不进 item_images），AI 拿不到图，这两项**恒空**——铺在界面上
      // 就是三行空框（2026-09-22 用户点名）。所以这里按「这条有没有本地图片」决定
      // 显不显示，而不是按「值空不空」：图片素材上这两项为空说明 AI 没读出来，
      // 那是值得看见的信息，要继续显示。抓来的封面**没有**喂给 AI，别误以为会填。
      if (hasLocalImgs) {
        h.push('<label class="fl">画面描述</label>');
        h.push(owner ? '<input class="inp" id="fCaption" value="' + esc(it.ai_caption || '') + '">' : ro(it.ai_caption));
        h.push('<label class="fl">图中文字 <span class="muted">（会被搜索命中）</span></label>');
        h.push(owner
          ? '<textarea class="inp" id="fOcr" style="min-height:70px">' + esc(it.ocr_text || '') + '</textarea>'
          : ro(it.ocr_text, 'small'));
      }

      // 「原文」是**所有者补录的入口**，不是给人读的内容——它的用途是搜索命中
      // 与喂 AI 分类（ai.js 的【文本】）。所以空态与上面两项不同：
      //   · 所有者：永远显示。空着正是要他填的时候，藏起来他就再也补不了。
      //   · 访客：空着整块不渲染。他没有可补的东西，留着只是一个空框。
      // （2026-09-22 修正：我起初把这条读成「空就一律不显示」——那会把所有者
      //   的补录入口一起删掉，原文为空时他彻底没法粘贴文本。）
      if (showRaw) {
        h.push('<label class="fl">原文 <span class="muted">你自己粘的那段，'
          + (it.raw_text ? it.raw_text.length + ' 字' : '现在是空的') + '</span></label>');
        h.push(owner
          ? '<textarea class="inp" id="fRaw" style="min-height:110px">' + esc(it.raw_text || '') + '</textarea>'
          : ro(it.raw_text, 'small'));
      }
      h.push('</div>');
    }

    /* ---- 6 记录（改动对照 + 时间，折叠） ---- */
    h.push('<details class="panel fold"><summary><span>记录</span>'
      + '<span class="muted">改动对照 · 时间与状态</span></summary>'
      + '<div class="foldbody">'
      + diffHtml(it)
      + '<div class="subttl">时间与状态</div>'
      + '<div class="kv"><b>录入时间</b><span>' + esc(fmtTime(it.created_at, true) || '—') + '</span></div>'
      + '<div class="kv"><b>最后改动</b><span>' + esc(fmtTime(it.updated_at, true) || '—') + '</span></div>'
      + '<div class="kv"><b>AI 最近一次</b><span>' + (ai.at ? esc(fmtTime(ai.at, true))
          + (ai.ms ? '（耗时 ' + (ai.ms / 1000).toFixed(1) + 's）' : '') : '没有记录') + '</span></div>'
      + '<div class="kv"><b>素材类型</b><span>' + esc(it.source_type || '—') + '</span></div>'
      // 正文抓到了多少字（2026-09-22）。放在这儿而不是正文卡片里：
      // 它是排查用的信息（「为什么这条没有总结」先看这个数），不是给人读的内容。
      + '<div class="kv"><b>网页正文</b><span>'
        + (it.page_text ? it.page_text.length + ' 字（抓到了）' : '没有（没抓或抓不到）') + '</span></div>'
      + '</div></details>');

    /* ---- 7 管理（分享 + 删除，折叠，仅所有者） ---- */
    h.push('<details class="panel fold owner-only"><summary><span>管理</span>'
      + '<span class="muted">分享这一条 · 删除</span></summary><div class="foldbody">'
      + '<div class="subttl">分享这一条 <span class="muted">只读链接，只包含这一条</span></div>'
      + '<div id="shareOneBox"><div class="shnone">读取中…</div></div>'
      + '<div class="subttl">删除</div>'
      + '<div class="muted" style="margin-bottom:10px">删除会连这条的图片一起删掉，删完取不回来。</div>'
      + '<div class="danger"><div class="row">'
      + '<button class="btn del sm" data-act="del1">删除这条素材</button>'
      + '<span class="muted" id="delHint"></span>'
      + '</div></div>'
      + '</div></details>');

    $('fields').innerHTML = h.join('');
    renderShareOne();
  }

  /* ---------- 分享这一条 ---------- */

  // 与首页同一个形态（/i/令牌，PRD 4.6）。发布时若平台不支持路径转发，
  // 改这一处为 '?t=' + token 即可，share.html 两种都认。
  function shareUrl(token) {
    return location.origin + location.pathname.replace(/[^/]*$/, '') + 'i/' + token;
  }

  function renderShareOne() {
    var box = $('shareOneBox');
    if (!box) return;
    if (!A.isOwner()) { box.innerHTML = ''; return; }
    var it = state.item;
    var tok = (it.share_token || '').trim();

    if (!tok) {
      box.innerHTML = '<div class="shnone">这条还没有分享出去。生成链接后，拿到链接的人只能看到这一条。</div>'
        + '<div class="shacts"><button class="linkbtn" data-act="share-on">生成只读链接</button></div>';
      return;
    }
    box.innerHTML = '<div class="shlink">' + esc(shareUrl(tok)) + '</div>'
      + '<div class="shacts">'
        + '<button class="linkbtn" data-act="share-copy">复制链接</button>'
        + '<button class="linkbtn" data-act="share-open">预览访客看到的样子</button>'
        + '<button class="linkbtn" data-act="share-off">关闭这条的分享</button>'
      + '</div>'
      + '<div class="shnone" style="margin-top:8px">关闭后这个链接立即失效。</div>';
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; });
    }
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  }

  function render() {
    var it = state.item;
    if (!it) return;
    $('wrap').style.display = '';
    var label = (it.ai_title || '').trim();
    $('hdrNote').textContent = label || ('素材 #' + it.id);
    $('dCrumb').textContent = '素材 #' + it.id + (label ? ' · ' + label : (it.category ? ' · ' + it.category : ''));

    var st = it.status === 'pending' ? '<span class="spin"></span>AI 识别中'
      : (it.status === 'failed'
          ? (A.isOwner()
              ? 'AI 识别没完成 · <a class="linkbtn" href="add.html?retry=' + it.id + '">重跑 AI</a>'
              : 'AI 识别没完成')
          : 'AI 已完成');
    $('dStatus').innerHTML = st;

    renderCover();
    renderShots();
    renderFields();
  }

  /* ---------- 图片放大（F5-1 可放大 / F5-7） ---------- */

  function zoom(i) {
    var im = state.imgs[i];
    if (!im) return;
    state.zoomIndex = i;
    $('zoomTitle').textContent = '第 ' + (i + 1) + ' / ' + state.imgs.length + ' 张';
    $('zoomBox').innerHTML = '<img src="' + S.toDataUrl(im.mime, im.data_base64) + '" alt="">';
    // 多图在同一个放大层里切换：封面是入口，不该把第 2 张藏到页面下方。
    $('zoomPrev').disabled = i === 0;
    $('zoomNext').disabled = i === state.imgs.length - 1;
    $('zoom').classList.add('on');
  }

  function stepZoom(delta) {
    zoom(state.zoomIndex + delta);
  }

  /* ---------- 封面重做（F5-8） ---------- */

  // 把第 coverIndex 张图解码成原件。每张图都从库里的 1600px 原件重解，
  // 不复用内存缓存：详情页可能刚被刷新过，且重裁要的是原件的真实像素尺寸。
  function rawOf(coverIndex) {
    var im = state.imgs[coverIndex];
    if (!im) return Promise.reject(new Error('这张图读不到'));
    return fetch(S.toDataUrl(im.mime, im.data_base64))
      .then(function (r) { return r.blob(); })
      .then(IMG.processRaw);
  }

  // 要重裁，先得有矩形。没有就现场判一次，并把结果按图存下来——
  // 存下来这件事是关键：第二次点「重裁」就不用再等 AI 了。
  function ensureRect(coverIndex) {
    var have = rectFor(coverIndex);
    if (have) return Promise.resolve({ rect: have, fresh: false });

    var im = state.imgs[coverIndex];
    if (!im) return Promise.reject(new Error('这张图读不到，判不了矩形'));

    toast('正在让 AI 判第 ' + (coverIndex + 1) + ' 张图的画面区，可能要等十几秒…');
    return rawOf(coverIndex)
      .then(IMG.makeAiInput)
      .then(function (aiImage) {
        return AI.detectRect({ aiImage: aiImage });
      })
      .then(function (r) {
        if (!r.rect) {
          // AI 认为整张图就是画面（或矩形不可信）。这是有效结论，不是失败，
          // 所以不写库、也不再重裁，如实告诉用户「这张不用裁」。
          return { rect: null, fresh: true };
        }
        return S.setImageRect(state.item.id, im.seq, r.rect)
          .then(function () {
            im.ai_rect = r.rect;      // 本地同步，免得再读一次库
            return { rect: r.rect, fresh: true };
          });
      });
  }

  // reason 是给埋点 E13 用的动作来源：换封面图 / 改回整图 / 重裁。
  // 三者都归「手动换封面」，但排查「封面裁得准不准」时它们的含义完全不同。
  function reloadThumb(coverIndex, mode, reason) {
    var im = state.imgs[coverIndex];
    if (!im) { toast('这张图读不到，无法重做封面'); return Promise.resolve(); }

    var rectJob = mode === 'crop'
      ? ensureRect(coverIndex)
      : Promise.resolve({ rect: null, fresh: false });

    return rectJob.then(function (rr) {
      if (mode === 'crop' && !rr.rect) {
        toast('AI 认为这张图整张都是画面，没有可裁的地方');
        return null;
      }
      return rawOf(coverIndex)
        .then(function (raw) { return IMG.makeCover(raw, mode === 'crop' ? rr.rect : null); })
        .then(function (c) {
          return save({
            cover_thumb: c.thumb.base64,
            cover_source: c.coverSource,
            cover_index: coverIndex
          }, c.coverSource === 'crop' ? '已按 AI 矩形重裁封面' : '封面已改用整图')
            .then(function () {
              // E13：手动换封面。记动作来源与「矩形是不是刚判的」——
              // 「AI 判过、用户又换了一次」说明裁得不准；「AI 从没判过」说明没走过 AI。
              // 两者要修的东西完全不同。
              T.event('cover_replaced', {
                item_id: state.item.id,
                reason: reason || 'unknown',
                mode: mode,
                seq: coverIndex,
                rect_fresh: !!rr.fresh,
                ai_rect: rr.rect || null
              });
              return c;
            });
        });
    });
  }

  /* ---------- 交互 ---------- */

  // 统一挂在 document 上做事件委托：可点的东西散在封面区、图片条、字段区三块，
  // 各挂各的监听很容易漏（原来就把封面按钮漏在 #fields 之外了）。
  document.addEventListener('click', function (e) {
    // 遮罩关闭
    if (e.target.hasAttribute && e.target.hasAttribute('data-close')) { $('zoom').classList.remove('on'); return; }
    if (e.target.id === 'zoom') { $('zoom').classList.remove('on'); return; }

    var step = e.target.closest('[data-zoom-step]');
    if (step) { stepZoom(Number(step.getAttribute('data-zoom-step'))); return; }

    // 放大原图
    var z = e.target.closest('[data-act="zoom"]');
    if (z) { zoom(Number(z.getAttribute('data-i'))); return; }

    var it = state.item;
    var t = e.target;

    var rm = t.closest('[data-act="rmtag"]');
    if (rm) {
      var tag = rm.getAttribute('data-tag');
      var key = rm.getAttribute('data-from') === 'my' ? 'my_tags' : 'ai_tags';
      var patch = {};
      patch[key] = (it[key] || []).filter(function (x) { return x !== tag; });
      save(patch, key === 'ai_tags' ? '已去掉 AI 的「' + tag + '」' : '已删除标签「' + tag + '」');
      return;
    }

    var cat = t.closest('[data-cat]');
    if (cat && A.isOwner()) {
      var name = cat.getAttribute('data-cat');
      if (name === it.category) return;
      save({ category: name }, '抽屉已改为「' + name + '」');
      return;
    }

    var plat = t.closest('[data-plat]');
    if (plat && A.isOwner()) {
      var p = plat.getAttribute('data-plat');
      if (p === it.source_platform) return;
      save({ source_platform: p }, '来源已改为「' + p + '」');
      return;
    }

    var el = t.closest('[data-act]');
    var act = el && el.getAttribute('data-act');
    if (act === 'open-src') {
      // 网址素材的封面图：库里没有原件可放大，点它就是去原文（2026-09-22）。
      if (it.source_url) window.open(it.source_url, '_blank', 'noopener');
      else toast('这条没有原文网址');
      return;
    }
    if (act === 'cover-use') {
      // 换封面图：先按整图铺上（那一刻还不知道该裁哪儿），用户可以再点「重裁」——
      // 2026-09-20 起重裁对任意一张封面图都可用（原先只在第 1 张时可用，见 rectFor 注释）。
      reloadThumb(Number(el.getAttribute('data-i')), 'raw', 'switch');
      return;
    }
    if (act === 'save-fields') { saveFields(); return; }
    if (act === 'share-on') {
      save({ share_token: S.newShareToken() }, '已生成只读链接');
      return;
    }
    if (act === 'share-off') {
      save({ share_token: null }, '已关闭这条的分享，原链接失效');
      return;
    }
    if (act === 'share-copy') {
      var u1 = $('shareOneBox').querySelector('.shlink').textContent;
      copyText(u1).then(function (ok) { toast(ok ? '链接已复制' : '复制失败，请手动选中链接复制'); });
      return;
    }
    if (act === 'share-open') {
      var u2 = $('shareOneBox').querySelector('.shlink').textContent;
      window.open(u2, '_blank', 'noopener');
      return;
    }
    if (act === 'cover-raw') { reloadThumb(state.item.cover_index || 0, 'raw', 'uncrop'); return; }
    // 重裁的对象是**当前封面那张图**，不再是写死的第 1 张
    if (act === 'cover-crop') { reloadThumb(state.item.cover_index || 0, 'crop', 'recrop'); return; }
    if (act === 'del1') { confirmDelete(); return; }
    if (act === 'del2') { doDelete(); return; }
    if (act === 'delCancel') { resetDelete(); return; }
  });

  // 键盘是桌面端最快的翻图方式；焦点在输入框时不接管方向键，避免影响编辑。
  document.addEventListener('keydown', function (e) {
    if (!$('zoom').classList.contains('on')) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    if (e.key === 'ArrowLeft' && state.zoomIndex > 0) { e.preventDefault(); stepZoom(-1); }
    if (e.key === 'ArrowRight' && state.zoomIndex < state.imgs.length - 1) { e.preventDefault(); stepZoom(1); }
  });

  // 手机端横滑只在放大层内生效；纵向移动不触发，避免抢图片滚动。
  (function () {
    var x0 = null, y0 = null;
    $('zoomBox').addEventListener('touchstart', function (e) {
      var p = e.changedTouches && e.changedTouches[0];
      if (p) { x0 = p.clientX; y0 = p.clientY; }
    }, { passive: true });
    $('zoomBox').addEventListener('touchend', function (e) {
      var p = e.changedTouches && e.changedTouches[0];
      if (!p || x0 === null) return;
      var dx = p.clientX - x0, dy = p.clientY - y0;
      x0 = y0 = null;
      if (Math.abs(dx) < 48 || Math.abs(dx) <= Math.abs(dy)) return;
      stepZoom(dx < 0 ? 1 : -1);
    }, { passive: true });
  }());

  $('fields').addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.id === 'tagAdd' && e.key === 'Enter') {
      e.preventDefault();
      var v = t.value.trim().replace(/^#/, '').slice(0, 12);
      if (!v) return;
      var it = state.item;
      var all = (it.ai_tags || []).concat(it.my_tags || []);
      if (all.indexOf(v) >= 0) { toast('这个标签已经有了'); return; }
      t.value = '';
      save({ my_tags: (it.my_tags || []).concat([v]) }, '已加标签「' + v + '」');
    }
    if (t.id === 'platFree' && e.key === 'Enter') {
      e.preventDefault();
      var name = t.value.trim().slice(0, 20);
      if (!name) return;
      if (cfg.platforms.indexOf(name) >= 0) { save({ source_platform: name }, '来源已改为「' + name + '」'); return; }
      save({ source_platform: name }, '来源已改为「' + name + '」');
    }
  });

  // 保存条要会「亮」。按钮从卡片中段挪到常驻位置只解决了一半问题——另一半是
  // 让人知道**现在有没保存的东西**：这些字段（标题/摘要/链接/备注/文本）不是即改即存，
  // 改完不点保存就白改，而它们分散在多张卡片里，很容易改完就滚走了（2026-09-22）。
  // 挂在 document 上而不是 #fields：项目名称与摘要 2026-09-22 搬到了左栏的封面卡片里，
  // 已经不在 #fields 这个容器内。
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (!id) return;
    if (['fTitle', 'fSummary', 'fDigest', 'fCaption', 'fOcr', 'fNote', 'fUrl', 'fRaw'].indexOf(id) < 0) return;
    var bar = $('saveBar');
    if (bar) bar.classList.add('dirty');
  });

  // 「保存条」那一次提交。字段分散在「基本信息 / 来源 / 我为什么存它 / 文本」四张卡片里，
  // 一次全存——所以按钮必须在**常驻位置**（#saveBar），不能埋在中间某张卡片里（2026-09-22）。
  // 取不到的元素跳过（访客态不渲染这些输入框，不该因此报错）。
  function fv(id) {
    var el = $(id);
    return el ? el.value.trim() : undefined;
  }
  function saveFields() {
    var patch = {};
    var pairs = [['fTitle', 'ai_title'], ['fSummary', 'ai_summary'],
      // 三段总结（2026-09-22）。它可改是有意的：digest 是「值不值得点进原文」
      // 的唯一依据，AI 写偏了这一条就没用了。改不改得动，也正好是判断这套
      // 总结可不可用的依据（A2 的修改率就是拿它算的，见 diff.js）。
      ['fDigest', 'ai_digest'],
      ['fCaption', 'ai_caption'],
      ['fOcr', 'ocr_text'], ['fRaw', 'raw_text'], ['fNote', 'my_note'], ['fUrl', 'source_url']];
    pairs.forEach(function (p) {
      var v = fv(p[0]);
      if (v === undefined) return;
      // ai_title 空串要存成空串（「未命名」是合法状态）；其余空串落成 null
      patch[p[1]] = (p[1] === 'ai_title') ? v : (v || null);
    });
    save(patch, '已保存');
  }

  /* ---------- 删除（F5-3：二次确认） ---------- */

  function confirmDelete() {
    var row = document.querySelector('.danger .row');
    row.innerHTML = '<span class="muted">确认删除第 ' + state.item.id + ' 条？连同它的图片一起删，不能恢复。</span>'
      + '<button class="btn del sm" data-act="del2">确认删除</button>'
      + '<button class="btn ghost sm" data-act="delCancel">取消</button>';
  }

  function resetDelete() {
    var row = document.querySelector('.danger .row');
    row.innerHTML = '<button class="btn del sm" data-act="del1">删除这条素材</button>'
      + '<span class="muted" id="delHint"></span>';
  }

  function doDelete() {
    var row = document.querySelector('.danger .row');
    row.innerHTML = '<span class="muted">正在删除…</span>';
    S.deleteItem(state.item.id).then(function () {
      // 删完回素材库并给一句确认。`deleted=` 的提示处理代码在素材库页里
      // （原 index.html 的启动段随整体迁移进了 library.html），所以这里必须
      // 指向 library.html —— 指回 index.html 的话提示会静默丢掉。
      location.href = 'library.html?deleted=' + state.item.id;
    }).catch(function (e) {
      showErr('删除失败：' + fmtErr(e));
      resetDelete();
    });
  }

  /* ---------- 顶栏与权限变化 ---------- */

  // 解锁或退出后要重画字段区：所有者的输入框与只读视图是两套渲染，
  // 靠 CSS 隐藏只能藏住元素，藏不住「访客时根本没有的输入框」。
  window.Elangit.onOwnerChange = function () { if (state.item) render(); };
  OB.mount();

  /* ---------- 启动 ---------- */

  if (!id) {
    showErr('网址里没有素材编号（应该形如 item.html?id=12）。返回素材库点一张卡片进来。');
  } else {
    // 项目名只用来写面包屑。读不到就不写——不为了一个抬头让整个详情页报错。
    if (fromDeck && deckPid) {
      S.fetchProject(deckPid).then(function (p) {
        if (p) { deckName = p.name || '未命名项目'; applyDeckBack(); }
      }, function () { /* 读不到项目名不影响详情 */ });
    }
    Promise.all([S.loadTaxonomy(), S.fetchItem(id), S.getImages(id)]).then(function (r) {
      state.taxonomy = r[0];
      state.item = r[1];
      state.imgs = r[2];
      if (!state.item) { showErr('库里没有 #' + id + ' 这条素材，可能已经被删了。'); return; }
      render();
      // render 会把面包屑重写成「素材」，所以这里补一次（项目名若已回来）。
      applyDeckBack();
      if (/[?&]deleted=/.test(location.search)) toast('已删除');
    }).catch(function (e) {
      showErr('读素材失败：' + fmtErr(e));
    });
  }
})();
</script>
</body>
</html>
