<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elangit · 全库翻阅</title>
<link rel="stylesheet" href="style.css">
<!-- 牌堆的版式与交互都在 projects.css / projects.js 里（与项目翻阅页同一套）。
     这里引用它们，而不是在首页再写一份：手感只有一份实现，修一处就够。 -->
<link rel="stylesheet" href="projects/projects.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">Elangit</a>
  <nav class="hnav hnav-home">
    <!-- 顶栏只留「素材库」一项（2026-09-23 首页重构）：项目与数据的入口
         分别落在选项目浮层和素材库内部，首页是翻阅页，不该再堆导航。
         ≤400px 这一项会被收起（见 projects.css）—— 底部中间的「进入素材库」
         才是规格指定的那个入口，它在任何宽度都还在。 -->
    <a href="library.html">素材库</a>
  </nav>
  <!-- 左上「新建项目」/ 右上「添加素材」是首页仅有的两个动作（H0-2 / H0-3）。
       都挂 owner-only：只读访客点不动写操作，藏起来比点了报错干净。
       两个标签各写长短两份：≤560px 用短的，否则 375px 机型顶栏会横向溢出
       （实测溢出 8px；320px 溢出 63px）。 -->
  <button class="btn ghost sm owner-only" id="newBtn" type="button">
    <span class="hlg">新建项目</span><span class="hsm">新建</span>
  </button>
  <div class="spacer"></div>
  <span class="muted" id="hdrNote">全库翻阅</span>
  <a class="btn sm owner-only" id="addBtn" href="add.html">
    <span class="hlg">添加素材</span><span class="hsm">添加</span>
  </a>
  <span id="ownerBar"></span>
</header>

<div class="deck-page">

  <aside class="dkside">
    <div class="dsec">
      <h3>当前项目</h3>
      <!-- 首页没有天然的项目上下文：这两个元素由 projects.js 的 applyHeader()
           按「当前项目」填，没选项目时写「未选择项目」。 -->
      <div class="dname" id="dname"></div>
      <div class="dbrief" id="dbrief"></div>
      <div class="dlinks">
        <button class="linkbtn" id="pickBtn" type="button">切换 / 新建项目</button>
      </div>
    </div>
    <div class="dsec">
      <h3>收藏写到哪</h3>
      <div id="dtags"></div>
    </div>
    <div class="dsec">
      <h3>去哪儿</h3>
      <div class="dlinks">
        <a class="linkbtn" href="library.html">素材库</a>
        <a class="linkbtn" href="projects/index.html">管理全部项目</a>
      </div>
    </div>
  </aside>

  <div class="deck-stage deck-stage-home" id="stage">
    <div class="errcard" id="deErr" style="display:none"></div>

    <div class="dkmob">
      <div class="mname"><a id="dname2" href="projects/index.html">未选择项目</a></div>
      <div class="mtag" id="mcount">已收藏 0</div>
      <button class="linkbtn" id="pickBtn2" type="button">切换</button>
    </div>

    <!-- 牌堆。九张卡绝对定位叠在同一个容器里，位置/缩放/透明度/层级全部由
         projects.js 按 CSS 里的 --deck-* 参数算；这里的结构与项目翻阅页
         逐字一致（同一份引擎认这 17 个 id）。 -->
    <div class="deckbox">
      <div class="deckcards" id="cards"></div>
    </div>

    <div class="deckempty" id="deckEmpty" style="display:none"></div>

    <div class="deckfoot" id="deckfoot">
      <button class="btn sm" id="prevBtn" type="button">‹ 上一张</button>
      <span class="dprog" id="prog"></span>
      <button class="btn sm" id="nextBtn" type="button">下一张 ›</button>
    </div>
    <div class="decknotes" id="deckNotes"></div>

    <div class="homefoot">
      <a class="btn ghost sm" href="library.html">进入素材库</a>
    </div>
  </div>

  <aside class="dkside dkside-r">
    <div class="dsec">
      <h3>收进这个项目的</h3>
      <div class="dstat" id="dcount">0 条</div>
      <div class="dlist" id="dlist"></div>
    </div>
    <div class="dsec">
      <h3>怎么翻</h3>
      <div class="dstat">
        左右拖动、滚轮或键盘 ← → 翻阅；点中央卡翻面看设计说明。<br>
        看到合适的，点卡片右下角爱心收进当前项目 —— 再点一次取消。
      </div>
    </div>
  </aside>

</div>

<!-- 选项目浮层（H0-4）。没有「当前项目」时点爱心必须落到这里，不静默收藏。 -->
<div class="hsel" id="picker" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <section class="hsel-box">
    <h2 id="pTitle">收藏到哪个项目？</h2>
    <p class="hsel-note" id="pNote"></p>
    <div class="hsel-list" id="pList"></div>
    <button class="hsel-more" id="pMore" type="button" aria-expanded="false" hidden>显示已归档项目</button>
    <div class="hsel-arch" id="pArch" hidden></div>
    <div class="hsel-split"></div>
    <div class="hsel-form" id="pForm" hidden>
      <input class="inp" id="pName" placeholder="项目名称（可留空，会存成「未命名项目」）" autocomplete="off">
      <div class="hsel-row">
        <button class="btn ghost sm" id="pCancel" type="button">取消</button>
        <button class="btn sm owner-only" id="pGo" type="button">创建并收藏</button>
      </div>
    </div>
    <div class="hsel-row" id="pNewRow">
      <a class="linkbtn" href="projects/index.html">管理全部项目</a>
      <button class="btn ghost sm owner-only" id="pNew" type="button">新建项目</button>
    </div>
  </section>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="cards.js"></script>
<script src="store.js"></script>
<script src="ownerbar.js"></script>
<script src="projects/projects.js"></script>
<script>window.Elangit.projects.initHome();</script>
</body>
</html>
